name: ROLL99
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
packages:
  RollKit:
    path: Packages/RollKit
targets:
  ROLL99iOS:
    type: application
    platform: iOS
    sources:
      - Apps/iOS
    dependencies:
      - package: RollKit
        product: RollCore
      - package: RollKit
        product: RollUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.roll99
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: 5.9
  ROLL99Watch:
    type: application
    platform: watchOS
    sources:
      - Apps/Watch
    dependencies:
      - package: RollKit
        product: RollCore
      - package: RollKit
        product: RollUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.roll99.watch
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_WKApplication: YES
        TARGETED_DEVICE_FAMILY: 4
        SWIFT_VERSION: 5.9
schemes:
  ROLL99iOS:
    build:
      targets:
        ROLL99iOS: all
  ROLL99Watch:
    build:
      targets:
        ROLL99Watch: all